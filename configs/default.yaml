project:
  name: personalised_ai_mastering
  seed: 42

data:
  raw_dir: data/raw
  prepared_dir: data/prepared
  splits_dir: data/splits
  sample_rate: 44100
  bit_depth: 24
  target_lufs: -23.0
  segment_length_sec: 5.0
  segment_hop_sec: 2.5
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1

training:
  batch_size: 8
  learning_rate: 0.0001
  lr_scheduler: cosine
  max_epochs: 200
  early_stopping_patience: 20
  loss:
    l1_weight: 1.0
    spectral_weight: 1.0
    stft_sizes: [512, 1024, 2048]
  effect_chain:
    - parametric_eq
    - compressor
    - limiter

evaluation:
  metrics:
    - snr
    - spectral_convergence
    - lufs_difference
    - per_band_energy
    - crest_factor
  matchering_baseline: true

inference:
  output_dir: outputs
  dither: true
  true_peak_dbtp: -0.1

deployment:
  gradio_port: 7860
